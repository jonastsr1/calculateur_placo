<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Placo Intelligent</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Calculateur de Placo</h1>
            <p>Optimisez vos découpes et réduisez les chutes</p>
        </header>

        <main>
            <section class="input-section">
                <div class="card">
                    <h2>1. Dimensions des Plaques</h2>
                    <div class="form-group">
                        <label for="plate-height">Hauteur (cm)</label>
                        <input type="number" id="plate-height" value="250" min="1">
                    </div>
                    <div class="form-group">
                        <label for="plate-width">Largeur (cm)</label>
                        <input type="number" id="plate-width" value="120" min="1">
                    </div>
                </div>

                <div class="card">
                    <h2>2. Vos Murs</h2>
                    <div id="walls-container">
                        <!-- Wall inputs will be added here -->
                    </div>
                    <button id="add-wall-btn" class="btn secondary">+ Ajouter un mur</button>
                </div>

                <button id="calculate-btn" class="btn primary">Calculer l'optimisation</button>
            </section>

            <section id="results-section" class="results-section hidden">
                <div class="summary-card">
                    <h2>Résultats</h2>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Plaques nécessaires</span>
                            <span class="stat-value" id="total-plates">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Surface totale</span>
                            <span class="stat-value" id="total-area">0 m²</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Chutes</span>
                            <span class="stat-value" id="waste-percent">0%</span>
                        </div>
                    </div>
                </div>

                <div id="visualizer" class="visualizer">
                    <!-- Visualization will be rendered here -->
                </div>
                <div class="actions-footer" style="margin-top: 20px; text-align: right;">
                    <button id="export-pdf-btn" class="btn secondary">Télécharger PDF</button>
                </div>
            </section>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
